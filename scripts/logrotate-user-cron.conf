# Rotates user-owned log files written by TrueNAS cron jobs.
#
# IMPORTANT: This is intentionally NOT in /etc/logrotate.d/ — TrueNAS rebuilds
# the OS dataset on upgrade and would wipe it. It is driven by a TrueNAS-managed
# cron job ("rotate user cron logs") which lives in the middleware config DB and
# survives upgrades. logrotate refuses configs not owned by root, and this file
# is user-owned (git-tracked), so the cron stages a root:root copy in
# /run/logrotate-user-cron.conf each run, then runs logrotate against that.
# State persists in ~user/.logrotate-user-cron.state, independent of the system
# logrotate (/var/lib/logrotate/status) which is left untouched.
#
# oauth-status.json is deliberately excluded: it is a status file overwritten
# each run, not an append log.

/var/log/trim-daily-series.log
{
    weekly
    rotate 12
    maxsize 20M
    missingok
    notifempty
    compress
    delaycompress
    create 0644 user user
    su root root
}

# Checkrr's own file logger (logs.file in checkrr.yaml) has no level or rotation
# control upstream — it INFO-logs every "Hash Match=true" for ~104k files per
# nightly scan (~2 MB/day; it had reached 1.1 GB unrotated). The container holds
# the FD open and never reopens it, so this must be copytruncate, not create.
/mnt/app/db/checkrr/checkrr.log
{
    weekly
    rotate 4
    maxsize 20M
    missingok
    notifempty
    compress
    delaycompress
    copytruncate
    su root root
}

# Traefik's access log. accesslog.filepath writes to a bind-mounted host path
# and nothing was rotating it — it had reached 704 MB, unbroken since Feb 2026,
# and it is the only on-disk log traefik keeps (its application log goes to
# stdout, which the compose json-file driver already caps at 10M x 3).
#
# `create`, NOT copytruncate: traefik closes and reopens its configured log
# files on SIGUSR1 (documented behaviour, present since v2.0, and this is
# v3.7.11), which is exactly what logrotate's postrotate hook is for. Copying
# and truncating a file this size would be both expensive and lossy.
#
# `|| true` so a stopped traefik degrades to "rotated but not reopened" rather
# than failing the whole logrotate run for every other file in this config.
/mnt/app/db/traefik/logs/access.log
{
    daily
    rotate 30
    maxsize 200M
    missingok
    notifempty
    compress
    delaycompress
    create 0644 root root
    su root root
    sharedscripts
    postrotate
        /usr/bin/docker kill -s USR1 traefik > /dev/null 2>&1 || true
    endscript
}
