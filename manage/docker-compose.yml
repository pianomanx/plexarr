# host: server
# project: manage — *arr managers + Aurral

x-defaults: &defaults
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging: &log
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

# Phase 5: cap_drop baseline. Consumers do `<<: *hardened` + inline
# `cap_add: [...]` for caps they need back. `cap_drop: [ALL]` removes
# the 14 default capabilities Docker grants.
x-hardened: &hardened
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging: *log

# Phase 5: LSIO/PUID-based containers need these 5 caps to chown +
# drop privileges at startup. Used uniformly across the *arrs + aurral.
x-lsio-caps: &lsio_caps
  - CHOWN
  - FOWNER
  - DAC_OVERRIDE
  - SETUID
  - SETGID

services:
  sonarr:
    <<: *hardened
    cap_add: *lsio_caps
    image: lscr.io/linuxserver/sonarr:4.0.17
    container_name: sonarr
    environment:
      - PUID=999
      - PGID=999
    volumes:
      - /mnt/app/db/sonarr/config:/config
      - /mnt/data:/data
      - /mnt/data2:/data2
      - /mnt/download:/download
    ports:
      - 8989:8989
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8989/ping"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    labels:
      - "autoheal=true"
    networks:
      - edge_internal
      - arr_control
      - arr_egress

  sonarr4k:
    <<: *hardened
    cap_add: *lsio_caps
    image: lscr.io/linuxserver/sonarr:4.0.17
    container_name: sonarr4k
    environment:
      - PUID=999
      - PGID=999
    volumes:
      - /mnt/app/db/sonarr4k/config:/config
      - /mnt/data:/data
      - /mnt/data2:/data2
      - /mnt/download:/download
    ports:
      - 9090:9090
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:9090/ping"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    labels:
      - "autoheal=true"
    networks:
      - edge_internal
      - arr_control
      - arr_egress

  radarr:
    <<: *hardened
    cap_add: *lsio_caps
    image: lscr.io/linuxserver/radarr:6.2.1
    container_name: radarr
    environment:
      - PUID=999
      - PGID=999
    volumes:
      - /mnt/app/db/radarr/config:/config
      - /mnt/data:/data
      - /mnt/data2:/data2
      - /mnt/download:/download
    ports:
      - 7878:7878
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:7878/ping"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    labels:
      - "autoheal=true"
    networks:
      - edge_internal
      - arr_control
      - arr_egress

  radarr4k:
    <<: *hardened
    cap_add: *lsio_caps
    image: lscr.io/linuxserver/radarr:6.2.1
    container_name: radarr4k
    environment:
      - PUID=999
      - PGID=999
    volumes:
      - /mnt/app/db/radarr4k/config:/config
      - /mnt/data:/data
      - /mnt/data2:/data2
      - /mnt/download:/download
    ports:
      - 7979:7979
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:7979/ping"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    labels:
      - "autoheal=true"
    networks:
      - edge_internal
      - arr_control
      - arr_egress

  bazarr:
    <<: *hardened
    cap_add: *lsio_caps
    image: lscr.io/linuxserver/bazarr:1.6.0
    container_name: bazarr
    environment:
      - PUID=999
      - PGID=999
      - TZ=Some/Region
      - LANG=C.UTF-8
    volumes:
      - /mnt/app/db/bazarr/config:/config
      - /mnt/app/db/bazarr/subcleaner:/subcleaner
      - /mnt/data:/data
      - /mnt/data2:/data2
    ports:
      - 6767:6767
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:6767/api/system/ping"]
      interval: 30s
      timeout: 30s
      start_period: 60s
      retries: 3
    labels:
      - "autoheal=true"
    networks:
      - edge_internal
      - arr_control
      - arr_egress

  bazarr4k:
    <<: *hardened
    cap_add: *lsio_caps
    image: lscr.io/linuxserver/bazarr:1.5.6
    container_name: bazarr4k
    environment:
      - PUID=999
      - PGID=999
      - TZ=Some/Region
      - LANG=C.UTF-8
    volumes:
      - /mnt/app/db/bazarr4k/config:/config
      - /mnt/app/db/bazarr4k/subcleaner:/subcleaner
      - /mnt/data:/data
      - /mnt/data2:/data2
    ports:
      - 6868:6868
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:6868/api/system/ping"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    labels:
      - "autoheal=true"
    networks:
      - edge_internal
      - arr_control
      - arr_egress

  lidarr:
    <<: *hardened
    cap_add: *lsio_caps
    # nightly = the plugins-capable Lidarr branch (Servarr wiki). One-way DB
    # migration from develop. Deezer + Tidal acquisition is now native Lidarr
    # plugins (Soulseek stays via Soularr+slskd) — replaced RandomNinjaAtk
    # arr-scripts, which was removed (it ran curl|bash on every boot from a
    # now-unmaintained repo).
    image: lscr.io/linuxserver/lidarr:nightly@sha256:78888f208e531be21e2d10c02625e0271c08dd07e03a250825d9ee9e792b07a7
    container_name: lidarr
    environment:
      - PUID=999
      - PGID=999
      - TZ=Some/Region
    volumes:
      - /mnt/app/db/lidarr/config:/config
      - /mnt/data:/data
      - /mnt/data2:/data2
      - /mnt/download:/download
    ports:
      - 8686:8686
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8686/ping"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    labels:
      - "autoheal=true"
    networks:
      - edge_internal
      - arr_control
      - arr_egress

  aurral:
    <<: *hardened
    cap_add: *lsio_caps
    image: ghcr.io/lklynet/aurral:1.76.50
    container_name: aurral
    # Internal-only since 2026-09-02. Previously published at
    # music.yourdomain.com behind Traefik + oauth2-proxy (Plex login); now
    # reached only via the host port with Aurral's own password login.
    environment:
      - PUID=999
      - PGID=999
      - DOWNLOAD_FOLDER=/app/downloads
    ports:
      - "3005:3001"
    volumes:
      - /mnt/download/aurral:/app/downloads
      - /mnt/app/db/aurral:/app/backend/data
    networks:
      - arr_control
      - arr_egress

networks:
  nas_default:
    external: true
  edge_internal:
    external: true
  arr_control:
    external: true
  arr_egress:
    external: true
