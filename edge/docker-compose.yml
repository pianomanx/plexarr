# host: server
# project: edge — public ingress + auth/security perimeter
#
# Anchors duplicated per-zone (compose `include:` doesn't preserve YAML
# anchors as of v2.38.1; verified 2026-05-08).

x-defaults: &defaults
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging: &log
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

# Phase 5: cap_drop baseline. Consumers do `<<: *hardened` + inline
# `cap_add: [...]` for caps they need back. `cap_drop: [ALL]` removes
# the 14 default capabilities Docker grants.
x-hardened: &hardened
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging: *log

services:
  traefik:
    <<: *hardened
    # Traefik runs as root inside the container by default and binds 80
    # and 443 directly (host port-mapping doesn't change in-container
    # binds), so NET_BIND_SERVICE is required when default caps are
    # dropped. DAC_OVERRIDE is needed to read the SOPS-decrypted
    # middlewares.yml bind-mount (0600 user:user on host) since cap_drop
    # ALL strips root's normal DAC override.
    cap_add:
      - NET_BIND_SERVICE
      - DAC_OVERRIDE
    image: traefik:v3.7.13@sha256:f86a2cab1b5c649070c49f883c743dd32d8485a56e3368c5f93b9e91f1e91259
    container_name: "traefik"
    env_file:
      - ../common/secrets/.runtime/namecheap.env
    environment:
      - NAMECHEAP_TTL=1
    command:
     #- "--log.level=DEBUG"
      - "--api=true"
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.websecure.transport.respondingTimeouts.readTimeout=24h"
      # dashboard entrypoint: container listens on :8282 on all ifaces
      # but the host port mapping below pins it to 10.0.0.3 (DMZ NIC)
      # so it's invisible from WAN and from docker bridges.
      - "--entrypoints.dashboard.address=:8282"
      - "--certificatesresolvers.myresolver.acme.dnschallenge=true"
      - "--certificatesresolvers.myresolver.acme.dnschallenge.provider=namecheap"
      # Public resolvers for lego's challenge/CNAME lookups. Without these, lego
      # uses Docker's embedded resolver (127.0.0.11) and can fail to follow an
      # _acme-challenge CNAME delegation.
      - "--certificatesresolvers.myresolver.acme.dnschallenge.resolvers=1.1.1.1:53,1.0.0.1:53"
      - "--certificatesresolvers.myresolver.acme.caserver=https://acme-v02.api.letsencrypt.org/directory"
      - "--certificatesresolvers.myresolver.acme.email=user@yourdomain.com"
      - "--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.myresolver.acme.preferredchain=ISRG Root X1"
      - "--accesslog=true"
      - "--accesslog.filepath=/var/log/traefik/access.log"
      - "--accesslog.bufferingsize=100"
    ports:
      - "80:80"
      - "443:443"
      - "10.0.0.3:8282:8282"
    volumes:
      - /mnt/app/db/traefik/letsencrypt:/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /mnt/app/db/traefik/logs:/var/log/traefik
      # Dynamic config — split source so the SOPS-managed middlewares.yml
      # (with the CrowdSec bouncer key) materializes from the encrypted
      # store at scripts/up time, while the dashboard router stays
      # plaintext-committable in the repo.
      - ./traefik/dynamic/dashboard.yml:/etc/traefik/dynamic/dashboard.yml:ro
      - ../common/secrets/.runtime/traefik-middlewares.yml:/etc/traefik/dynamic/middlewares.yml:ro
    networks:
      - edge_ingress
      - edge_internal

  plex-oidc-bridge:
    <<: *hardened
    image: ghcr.io/user/plex-oidc-bridge:0@sha256:70381d6eb882054a28b9ecfb5594ecd88046fcc8806b8178b6bac84220d08fd3
    container_name: plex-oidc-bridge
    env_file:
      - ../common/secrets/.runtime/abook.env
    environment:
      - PUBLIC_URL=https://auth.yourdomain.com
      - ALLOWED_REDIRECT_URIS=https://abooks.yourdomain.com/api/auth/oidc/callback,https://ebookrequests.yourdomain.com/api/auth/oidc/callback,https://ebooks.yourdomain.com/oauth2-callback,https://games.yourdomain.com/api/oauth/openid
      - TRUST_PROXY_HEADERS=true
      - PLEX_PRODUCT_NAME=Yourdomain.com
    volumes:
      - /mnt/app/db/plex-oidc-bridge:/app/config
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.plex-oidc-bridge.rule=Host(`auth.yourdomain.com`)"
      - "traefik.http.routers.plex-oidc-bridge.entrypoints=websecure"
      - "traefik.http.routers.plex-oidc-bridge.tls.certresolver=myresolver"
      - "traefik.http.services.plex-oidc-bridge.loadbalancer.server.port=8080"
      - "traefik.docker.network=edge_internal"
    networks:
      - edge_internal
      - serve_plex_api
      - edge_egress  # outbound to plex.tv API

  crowdsec:
    <<: *hardened
    # crowdsec entrypoint runs as root, manages /etc/crowdsec +
    # /var/lib/crowdsec perms (chown to PGID), then runs the agent.
    # DAC_OVERRIDE needed to read traefik/nextcloud log bind-mounts.
    cap_add:
      - CHOWN
      - FOWNER
      - DAC_OVERRIDE
      - SETUID
      - SETGID
    image: crowdsecurity/crowdsec:v1.8.1@sha256:0f2523fa61ef507f15d953045cface490cc880670c62f2755ced17524107f71a
    container_name: crowdsec
    environment:
      - COLLECTIONS=crowdsecurity/traefik crowdsecurity/http-cve crowdsecurity/linux crowdsecurity/nextcloud
      - PGID=999
    volumes:
      - /mnt/app/db/crowdsec/config:/etc/crowdsec
      - /mnt/app/db/crowdsec/data:/var/lib/crowdsec/data
      - /mnt/app/db/traefik/logs:/var/log/traefik:ro
      - /mnt/data/nextcloud/nextcloud.log:/var/log/nextcloud/nextcloud.log:ro
      - ./crowdsec/acquis.yaml:/etc/crowdsec/acquis.d/traefik.yaml:ro
      - ./crowdsec/acquis-nextcloud.yaml:/etc/crowdsec/acquis.d/nextcloud.yaml:ro
    healthcheck:
      test: ["CMD", "cscli", "lapi", "status"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    ports:
      - "10.0.0.3:8180:8080"
    networks:
      - edge_internal
      - edge_egress  # outbound to api.crowdsec.net blocklists

  crowdsec-firewall-bouncer:
    <<: *hardened
    image: ghcr.io/shgew/cs-firewall-bouncer-docker:v0.0.34@sha256:ff1b5b0972ea0cfe39a4f10728effc38f6185a88b742fc4ad5a53d5dca80aca1
    container_name: crowdsec-firewall-bouncer
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
      # read the SOPS-decrypted config (0600 user:user on host) as root with
      # cap_drop ALL — same DAC pattern as traefik/rclone.
      - DAC_READ_SEARCH
    volumes:
      # config holds the LAPI api_key — SOPS-managed, decrypted to .runtime.
      - ../common/secrets/.runtime/crowdsec-firewall-bouncer.yaml:/config/crowdsec-firewall-bouncer.yaml:ro
    depends_on:
      crowdsec:
        condition: service_healthy

  # wizarr — invite-based onboarding for new Plex users. Kept here as a
  # reference; in practice it is only brought up while a new user is
  # actively being onboarded and torn down afterwards.
  wizarr:
    <<: *defaults
    container_name: wizarr
    image: ghcr.io/wizarrrr/wizarr
    environment:
      - TZ=Some/Region
      - DISABLE_INBUILT_AUTH=false
      - ALLOW_BUG_REPORTING=true
      - PUID=999
      - PGID=999
    volumes:
      - /mnt/app/db/wizarr:/data/database
    ports:
      - 5690:5690
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.wizarr.rule=Host(`join.yourdomain.com`)"
      - "traefik.http.routers.wizarr.entrypoints=websecure"
      - "traefik.http.routers.wizarr.tls.certresolver=myresolver"
      - "traefik.docker.network=edge_internal"
    networks:
      - edge_internal
      - nas_default

networks:
  nas_default:
    external: true
  edge_ingress:
    external: true
  edge_internal:
    external: true
  edge_egress:
    external: true
  serve_plex_api:
    external: true
