# host: server
# project: serve-books — audiobook + ebook stack

x-defaults: &defaults
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging: &log
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

# Phase 5: cap_drop baseline. Consumers do `<<: *hardened` + inline
# `cap_add: [...]` for caps they need back. `cap_drop: [ALL]` removes
# the 14 default capabilities Docker grants.
x-hardened: &hardened
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging: *log

# Phase 5: LSIO/PUID-based containers need these 5 caps to chown +
# drop privileges at startup.
x-lsio-caps: &lsio_caps
  - CHOWN
  - FOWNER
  - DAC_OVERRIDE
  - SETUID
  - SETGID

services:
  audiobookshelf:
    <<: *hardened
    # NET_BIND_SERVICE because the image binds container port 80 internally
    # (the 13378:80 host port-mapping is on the docker side, but the in-
    # container node process still needs to bind 80, which requires the cap
    # under cap_drop: ALL even when running as root).
    cap_add:
      - CHOWN
      - FOWNER
      - DAC_OVERRIDE
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
    image: ghcr.io/advplyr/audiobookshelf:2.35.1
    container_name: audiobookshelf
    ports:
      - 13378:80
    volumes:
      - /mnt/data2/media/audiobooks:/audiobooks
      - /mnt/data/media/podcasts:/podcasts
      - /mnt/app/db/audiobookshelf/config:/config
      - /mnt/app/db/audiobookshelf/metadata:/metadata
    environment:
      - TZ=Some/Region
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/healthcheck"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    labels:
      - "autoheal=true"
    # arr_egress (bridge) added so Docker can DNAT host:13378 → container
    # AND so ABS can reach Audible/cover-art metadata providers.
    networks:
      - edge_internal
      - arr_egress

  readmeabook:
    <<: *hardened
    # Multi-process container: supervisord (PID 1 as root) spawns
    # postgres/redis/node, then the entrypoint remaps them to UID 999.
    # CAP_KILL needed because root signaling non-root processes requires
    # it under cap_drop ALL. Beyond that, the LSIO 5-cap set covers the
    # init script's chown/chmod/usermod operations.
    cap_add:
      - CHOWN
      - FOWNER
      - DAC_OVERRIDE
      - SETUID
      - SETGID
      - KILL
    image: ghcr.io/kikootwo/readmeabook:1.2.1
    container_name: readmeabook
    ports:
      - "3030:3030"
    volumes:
      - /mnt/app/db/readmeabook/config:/app/config
      - /mnt/app/db/readmeabook/cache:/app/cache
      - /mnt/download:/download
      - /mnt/data2/media/audiobooks:/media
      - /mnt/app/db/readmeabook/pgdata:/var/lib/postgresql/data
      - /mnt/app/db/readmeabook/redis:/var/lib/redis
    environment:
      PUID: 999
      PGID: 999
      PUBLIC_URL: "https://abooks.yourdomain.com"
    # Image ships a HEALTHCHECK that's byte-identical to ours — let it own
    # the config so upstream tuning flows through automatically.
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=edge_internal"
      - "traefik.http.routers.readmeabook.rule=Host(`abooks.yourdomain.com`)"
      - "traefik.http.routers.readmeabook.entrypoints=websecure"
      - "traefik.http.routers.readmeabook.tls.certresolver=myresolver"
      - "traefik.http.services.readmeabook.loadbalancer.server.port=3030"
      # abooks.yourdomain.com is the ONLY hostname for this app (PUBLIC_URL above).
      # The legacy abook.yourdomain.com router (a 301 to the canonical host, kept
      # for old bookmarks) was removed 2026-08-24 — it was the last thing still
      # requesting an ACME cert for that name, and traefik kept retrying a stale
      # orphaned acme.json entry for it on every restart. The DNS CNAME is left
      # in place; abook.yourdomain.com now falls through to Traefik's default and
      # 404s rather than redirecting.
      - "autoheal=true"
    networks:
      - edge_internal
      - serve_plex_api
      - arr_egress
      - arr_control                   # internal: lets automation reach the RMAB API

  abs-tract:
    <<: *hardened
    image: arranhs/abs-tract:v0.2.0
    container_name: abs-tract
    networks:
      - serve_plex_api

  plex-scan-watcher:
    <<: *hardened
    image: alpine:3.24
    container_name: plex-scan-watcher
    command: sh -c "apk add --no-cache inotify-tools && /watch.sh"
    volumes:
      - ./plex-scan-watcher.sh:/watch.sh:ro
      - /mnt/data2/media/audiobooks:/audiobooks:ro
    env_file:
      - ../common/secrets/.runtime/abook.env
    environment:
      - PLEX_URL=http://plex:32400
      - PLEX_SECTION=11
      - SETTLE_TIME=30
    # arr_egress (bridge) needed for the on-boot `apk add inotify-tools`
    # over alpine repos. serve_plex_api alone is internal:true post-6c.
    networks:
      - serve_plex_api
      - arr_egress

  shelfmark:
    <<: *hardened
    cap_add: *lsio_caps
    image: ghcr.io/calibrain/shelfmark:v1.3.2
    container_name: shelfmark
    expose:
      - "8084"
    environment:
      - PUID=999
      - PGID=999
      - TZ=Some/Region
      - INGEST_DIR=/books
      - FLASK_PORT=8084
      - TORRENT_HARDLINK=true
      - HIDE_LOCAL_AUTH=false
      - OIDC_AUTO_REDIRECT=true
    volumes:
      - /mnt/app/db/shelfmark/config:/config
      - /mnt/data2/media/ebooks/bookdrop:/books
      - /mnt/download:/download:ro
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=edge_internal"
      - "traefik.http.routers.shelfmark.rule=Host(`ebookrequests.yourdomain.com`)"
      - "traefik.http.routers.shelfmark.entrypoints=websecure"
      - "traefik.http.routers.shelfmark.tls.certresolver=myresolver"
      - "traefik.http.services.shelfmark.loadbalancer.server.port=8084"
      - "autoheal=true"
    # arr_egress (bridge) needed for OIDC discovery — shelfmark resolves
    # auth.yourdomain.com via public DNS and round-trips through pfSense +
    # Traefik. arr_control + edge_internal are both internal:true post-6c.
    networks:
      - edge_internal
      - arr_control
      - arr_egress

  bookorbit-discord-notify:
    <<: *hardened
    image: alpine:3.24
    container_name: bookorbit-discord-notify
    # Announces books that actually LANDED in BookOrbit to #ebook-releases.
    #
    # Deliberately NOT Shelfmark's download_complete: since the 2026-08-22 switch
    # to BOOKS_OUTPUT_MODE=folder, a completed download has only reached the Book
    # Dock — it still has to clear auto-finalize before it is a book. Shelfmark
    # also cannot produce a rich card at all; its NotificationContext holds only
    # title/author/format/source and Apprise sends plain text, not embeds. That is
    # why Shelfmark has no Discord route; Telegram keeps its `all` route.
    #
    # Covers 401 without a JWT, so they cannot be linked by URL the way RomM's
    # can. The bytes are uploaded with the webhook as a multipart attachment
    # (attachment://cover.jpg), which also keeps ebook covers from being publicly
    # fetchable.
    command: sh -c "apk add --no-cache curl jq && exec /notify.sh"
    env_file:
      # BOOKORBIT_USER / BOOKORBIT_PASS / DISCORD_WEBHOOK. Dedicated SOPS file
      # rather than bookorbit.env so this container never sees the Postgres
      # password or the JWT/encryption keys.
      - ../common/secrets/.runtime/bookorbit-notify.env
    environment:
      BOOKORBIT_URL: http://bookorbit:3000
      PUBLIC_URL: https://ebooks.yourdomain.com
      POLL_INTERVAL: "300"
      # Ebooks arrive one or two at a time, so the default is a rich per-book
      # message with its cover. Above this, one plain summary embed instead —
      # Discord allows at most 10 attachments per message.
      BULK_THRESHOLD: "8"
      WEBHOOK_USERNAME: BookOrbit
    volumes:
      - ./bookorbit-discord-notify.sh:/notify.sh:ro
      - /mnt/app/db/bookorbit-discord-notify:/state
    depends_on:
      bookorbit:
        condition: service_started
    # arr_egress is a bridge AND bookorbit sits on it, so this one network covers
    # both reaching the API by name and outbound to alpine repos + discord.com.
    networks:
      - arr_egress

  # ---------------------------------------------------------------------------
  # BookOrbit — PRIMARY ebook app as of 2026-08-22 (promoted from trial).
  #
  # NOT a Booklore/Grimmory fork: an independent NestJS + Vue + Postgres
  # rewrite of the same feature set. Adopted because Grimmory's reader does
  # not work on Android, and because Book Dock's auto-fetch + auto-finalize
  # closes the metadata gap that Shelfmark's direct-API delivery left open.
  #
  # Grimmory + grimmory-mariadb were decommissioned 2026-08-22 once the switch
  # settled. /mnt/app/db/grimmory is deliberately RETAINED (data dir, MariaDB
  # datadir, and decomm/grimmory-2026-08-22-final.sql.gz — a logical dump taken
  # at teardown), so a rollback or a late progress migration only needs the two
  # service blocks and the serve_books_grimmory_db network restored from git.
  # ---------------------------------------------------------------------------
  bookorbit:
    <<: *hardened
    # Upstream's own compose uses exactly this cap set for the su-exec
    # privilege drop in server/entrypoint.sh.
    cap_add: *lsio_caps
    # Tag has no leading "v" — docker/metadata-action strips it.
    image: ghcr.io/bookorbit/bookorbit:2.6.0
    container_name: bookorbit
    init: true
    depends_on:
      bookorbit-postgres:
        condition: service_healthy
    expose:
      - "3000"
    env_file:
      - ../common/secrets/.runtime/bookorbit.env
    environment:
      NODE_ENV: production
      PORT: "3000"
      TZ: Some/Region
      PUID: 999
      PGID: 999
      POSTGRES_HOST: bookorbit-postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: bookorbit
      POSTGRES_DB: bookorbit
      APP_URL: https://ebooks.yourdomain.com
      # Keeps the library-creation folder picker off the container root.
      LIBRARY_BROWSE_ROOT: /books
      BOOK_DOCK_PATH: /bookdock
      # NOT set: OIDC_ALLOW_LOCAL_ISSUERS. auth.yourdomain.com resolves to the
      # WAN address (<WAN address>) and hairpins through pfSense, so the
      # issuer is a public host from the container's point of view and
      # BookOrbit's SSRF filter never sees a private address. This is the
      # same class of flag as Grimmory's OIDC_ALLOW_UNSAFE_HOSTS.
    volumes:
      - /mnt/data2/media/ebooks/library:/books
      # Shared with shelfmark, which drops completed downloads here in
      # folder mode. Nothing else watches this dock.
      - /mnt/data2/media/ebooks/bookdrop:/bookdock
      - /mnt/app/db/bookorbit/data:/data
    read_only: true
    tmpfs:
      - /tmp
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "node", "-e", "const p=process.env.PORT||3000;fetch('http://127.0.0.1:'+p+'/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=edge_internal"
      - "traefik.http.routers.bookorbit.rule=Host(`ebooks.yourdomain.com`)"
      - "traefik.http.routers.bookorbit.entrypoints=websecure"
      - "traefik.http.routers.bookorbit.tls.certresolver=myresolver"
      - "traefik.http.services.bookorbit.loadbalancer.server.port=3000"
      # Separate router for the send-to-Kindle email endpoints.
      - "traefik.http.routers.bookorbit-email.rule=Host(`ebooks.yourdomain.com`) && PathRegexp(`^/api/v[0-9]+/.*(email|send).*`)"
      - "traefik.http.routers.bookorbit-email.entrypoints=websecure"
      - "traefik.http.routers.bookorbit-email.tls.certresolver=myresolver"
      - "traefik.http.routers.bookorbit-email.priority=100"
      - "traefik.http.routers.bookorbit-email.service=bookorbit"
      # Code-split chunks: BookOrbit's Vue bundle is hundreds of content-hashed
      # files, served by their own router so they can be treated separately.
      - "traefik.http.routers.bookorbit-assets.rule=Host(`ebooks.yourdomain.com`) && PathPrefix(`/assets/`)"
      - "traefik.http.routers.bookorbit-assets.entrypoints=websecure"
      - "traefik.http.routers.bookorbit-assets.tls.certresolver=myresolver"
      - "traefik.http.routers.bookorbit-assets.priority=150"
      - "traefik.http.routers.bookorbit-assets.service=bookorbit"
      - "autoheal=true"
    networks:
      - edge_internal                 # traefik + postfix relay for send-to-Kindle
      - serve_books_bookorbit_db
      - arr_egress                    # metadata providers
      - arr_control                   # internal: lets automation reach the BookOrbit API

  bookorbit-postgres:
    <<: *hardened
    cap_add: *lsio_caps
    # pgvector image, not stock postgres: BookOrbit requires the vector,
    # pg_trgm and uuid-ossp extensions.
    image: pgvector/pgvector:pg18
    container_name: bookorbit-postgres
    env_file:
      - ../common/secrets/.runtime/bookorbit.env
    environment:
      POSTGRES_USER: bookorbit
      POSTGRES_DB: bookorbit
      PGDATA: /var/lib/postgresql/data/pgdata
      TZ: Some/Region
    volumes:
      - /mnt/app/db/bookorbit/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - serve_books_bookorbit_db

networks:
  nas_default:
    external: true
  edge_internal:
    external: true
  arr_control:
    external: true
  arr_egress:
    external: true
  serve_plex_api:
    external: true
  serve_books_bookorbit_db:
    external: true
